<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptFlow TCP — Projects</title>
    <meta name="description" content="Manage your Autoscript video logging projects. Create, open, and sync Google Sheets.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="project.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="topbar" id="topbar">
        <div class="topbar-inner">
            <a href="/tcpscript/project" class="topbar-logo">
                <span class="logo-title">TCP <span>ScriptFlow</span> <em>v2.0</em></span>
            </a>

            <div class="topbar-right">
                <div class="topbar-user" id="topbarUser">
                    <div class="topbar-avatar" id="topbarAvatar">
                        <span class="profile-initial" style="font-weight: 700; color: #fff; font-size: 14px;">U</span>
                    </div>
                    <span class="topbar-email" id="topbarEmail">User</span>
                </div>
                <a href="/tcpscript/setting" class="topbar-btn topbar-btn-settings" id="btnSettings" title="Settings" style="display: none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    <span>Settings</span>
                </a>
                <button type="button" class="topbar-btn topbar-btn-logout" id="btnLogout" title="Sign out">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    <span>Sign out</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Page Header -->
        <div class="page-header">
            <div class="page-header-left">
                <h1 id="pageTitle">Projects</h1>
                <p class="page-subtitle" id="pageSubtitle">Manage your video logging projects</p>
            </div>
            <div class="page-header-actions">
                <div class="project-toolbar" id="projectToolbar">
                    <label class="toolbar-search" for="projectSearchInput">
                        <span class="toolbar-search-icon" aria-hidden="true">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
                        </span>
                        <input type="search" id="projectSearchInput" placeholder="Search projects, speakers, sources..." autocomplete="off">
                    </label>
                    <label class="toolbar-sort toolbar-filter" for="projectStatusFilter">
                        <select id="projectStatusFilter" aria-label="Filter projects by status">
                            <option value="all">All Status</option>
                            <option value="ongoing">Ongoing</option>
                            <option value="not_started">Not Started Yet</option>
                            <option value="done">Done</option>
                        </select>
                        <span class="toolbar-sort-icon" aria-hidden="true">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </span>
                    </label>
                    <label class="toolbar-sort" for="projectSortSelect">
                        <select id="projectSortSelect" aria-label="Sort projects by date">
                            <option value="newest">Newest</option>
                            <option value="oldest">Oldest</option>
                        </select>
                        <span class="toolbar-sort-icon" aria-hidden="true">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </span>
                    </label>
                    <div class="view-toggle" role="group" aria-label="Project view">
                        <button type="button" class="view-toggle-btn active" id="btnGridView" title="Grid view" aria-pressed="true">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg>
                        </button>
                        <button type="button" class="view-toggle-btn" id="btnListView" title="List view" aria-pressed="false">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                        </button>
                    </div>
                </div>
                <button type="button" class="btn-new-project" id="btnNewProject">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    <span>New Project</span>
                </button>
            </div>
        </div>

        <div class="sync-notice" id="syncNotice" style="display: none;"></div>

        <!-- Project Grid View -->
        <div id="projectsView">
            <!-- Project Grid -->
            <div class="project-grid" id="projectGrid">
                <!-- Cards rendered by JS -->
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-icon">
                    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="12" y1="18" x2="12" y2="12"></line>
                        <line x1="9" y1="15" x2="15" y2="15"></line>
                    </svg>
                </div>
                <h3 id="emptyStateTitle">No projects yet</h3>
                <p id="emptyStateText">Create your first project to start logging timecodes. Each project is linked to a Google Sheet.</p>
                <button type="button" class="btn-new-project btn-empty" id="btnNewProjectEmpty">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    <span>Create First Project</span>
                </button>
            </div>
        </div>

        <!-- Loading State -->
        <div class="loading-state" id="loadingState" style="display: none;">
            <div class="skeleton-grid">
                <div class="skeleton-card"><div class="skeleton-shimmer"></div></div>
                <div class="skeleton-card"><div class="skeleton-shimmer"></div></div>
                <div class="skeleton-card"><div class="skeleton-shimmer"></div></div>
            </div>
        </div>
    </main>

    <!-- New Project Modal -->
    <div class="modal-overlay" id="newProjectModal" style="display: none;">
        <div class="modal-card" id="modalCard">
            <div class="modal-header">
                <h2>New Project</h2>
                <button type="button" class="modal-close" id="modalClose">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-input-group">
                    <label for="modalProjectName">Project Name</label>
                    <input type="text" id="modalProjectName" placeholder="Enter project name..." autocomplete="off">
                </div>
                <div class="modal-input-group">
                    <label for="modalProjectStatus">Status</label>
                    <select id="modalProjectStatus" autocomplete="off">
                        <option value="not_started">Not Started Yet</option>
                        <option value="ongoing">Ongoing</option>
                        <option value="done">Done</option>
                    </select>
                </div>
                <div class="modal-input-group">
                    <label for="modalSpeaker">Speaker <span class="input-optional">(Row 1 — B1)</span></label>
                    <input type="text" id="modalSpeaker" placeholder="e.g. JASON NGUYEN - CEO | TIERRA" autocomplete="off">
                </div>
                <div class="modal-input-group">
                    <label for="modalSource">Source <span class="input-optional">(Row 2 - B2)</span></label>
                    <input type="text" id="modalSource" placeholder="e.g. (26-03-2026) TCP ACL" autocomplete="off">
                </div>
                <div class="modal-input-group">
                    <label for="modalLink">Link</label>
                    <input type="url" id="modalLink" placeholder="https://..." autocomplete="off" spellcheck="false">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-modal-cancel" id="modalCancel">Cancel</button>
                <button type="button" class="btn-modal-create" id="modalCreate">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    <span>Create Project</span>
                </button>
            </div>
            <div class="modal-status" id="modalStatus" style="display: none;"></div>
        </div>
    </div>

    <!-- Edit Field Modal -->
    <div class="modal-overlay" id="editFieldModal" style="display: none;">
        <div class="modal-card modal-card-sm">
            <div class="modal-header">
                <h2 id="editFieldTitle">Edit Field</h2>
                <button type="button" class="modal-close" id="editFieldClose">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-input-group">
                    <label for="editFieldInput" id="editFieldLabel">Value</label>
                    <input type="text" id="editFieldInput" autocomplete="off">
                    <select id="editFieldSelect" style="display: none;">
                        <option value="not_started">Not Started Yet</option>
                        <option value="ongoing">Ongoing</option>
                        <option value="done">Done</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-modal-cancel" id="editFieldCancel">Cancel</button>
                <button type="button" class="btn-modal-create" id="editFieldSave">Save</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="confirmModal" style="display: none;">
        <div class="modal-card modal-card-sm">
            <div class="modal-header">
                <h2 id="confirmModalTitle">Confirm Action</h2>
                <button type="button" class="modal-close" id="confirmModalClose">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body">
                <p class="confirm-modal-text" id="confirmModalText"></p>
                <p class="confirm-modal-note" id="confirmModalNote" style="display: none;"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-modal-cancel" id="confirmModalCancel">Cancel</button>
                <button type="button" class="btn-modal-create btn-modal-danger" id="confirmModalConfirm">Delete</button>
            </div>
        </div>
    </div>

    <script src="project.js"></script>
</body>
</html>
