<div id="annotationModal" class="modal-overlay" style="display: none; align-items: center; justify-content: center; z-index: 9999; background: rgba(0,0,0,0.85);">
    <div class="modal-content" style="max-width: 90vw; width: 800px; padding: 20px; border-radius: var(--r-md); background: var(--bg-panel); border: 1px solid var(--border-bright); display: flex; flex-direction: column; gap: 16px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0; font-size: 16px; font-weight: 700; color: var(--text-main);">Annotate Frame</h3>
            <button id="btnAnnotationClose" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px;">&times;</button>
        </div>
        
        <div class="annotation-toolbar" style="display: flex; gap: 12px; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--border);">
            <div class="color-picker" style="display: flex; gap: 6px;">
                <button class="color-btn active" data-color="#ef4444" style="width: 24px; height: 24px; border-radius: 50%; background: #ef4444; border: 2px solid white; cursor: pointer;"></button>
                <button class="color-btn" data-color="#eab308" style="width: 24px; height: 24px; border-radius: 50%; background: #eab308; border: 2px solid transparent; cursor: pointer;"></button>
                <button class="color-btn" data-color="#22c55e" style="width: 24px; height: 24px; border-radius: 50%; background: #22c55e; border: 2px solid transparent; cursor: pointer;"></button>
                <button class="color-btn" data-color="#3b82f6" style="width: 24px; height: 24px; border-radius: 50%; background: #3b82f6; border: 2px solid transparent; cursor: pointer;"></button>
                <button class="color-btn" data-color="#ffffff" style="width: 24px; height: 24px; border-radius: 50%; background: #ffffff; border: 2px solid transparent; cursor: pointer;"></button>
            </div>
            <div style="width: 1px; height: 20px; background: var(--border);"></div>
            <button id="btnAnnotationUndo" class="btn-fs" style="padding: 4px 12px;">Undo</button>
            <button id="btnAnnotationClear" class="btn-delete" style="padding: 4px 12px;">Clear All</button>
        </div>

        <div style="position: relative; width: 100%; display: flex; justify-content: center; align-items: center; background: #000; border-radius: var(--r-sm); overflow: hidden;">
            <canvas id="annotationCanvas" style="max-width: 100%; max-height: 60vh; cursor: crosshair; touch-action: none;"></canvas>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 8px;">
            <button id="btnAnnotationCancel" class="btn-cancel" style="padding: 8px 16px; background: transparent; color: var(--text-main); border: 1px solid var(--border); border-radius: var(--r-sm); cursor: pointer;">Cancel</button>
            <button id="btnAnnotationSave" class="btn-fs" style="padding: 8px 16px;">Save Annotation</button>
        </div>
    </div>
</div>
