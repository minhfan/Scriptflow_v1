    <header>
        <div class="header-logo">
            <a href="/tcpscript/project" title="Back to Projects" style="display: inline-flex; align-items: center; gap: 4px; color: var(--text-muted); text-decoration: none; font-size: 10px; font-weight: 500; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border, #334155); margin-right: 10px; transition: all 0.2s;" onmouseover="this.style.color='var(--accent, #10b981)';this.style.borderColor='var(--accent, #10b981)'" onmouseout="this.style.color='var(--text-muted)';this.style.borderColor='var(--border, #334155)'">&larr; Projects</a>
            <a href="/tcpscript/project" class="app-topbar-logo" aria-label="Back to project list">
                <span class="logo-title">TCP <span>ScriptFlow</span> <em>v2.0</em></span>
            </a>
        </div>
        <div class="header-controls">
            <span id="saveStatus">Saved</span>
            <select id="fpsSelect" class="btn-header" style="width: auto;">
                <option value="23.976">23.976 fps</option>
                <option value="24">24 fps</option>
                <option value="25">25 fps</option>
                <option value="29.97" selected>29.97 fps</option>
                <option value="30">30 fps</option>
                <option value="50">50 fps</option>
                <option value="59.94">59.94 fps</option>
                <option value="60">60 fps</option>
            </select>
            <select id="themeSelect" class="btn-header" style="width: auto;">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
                <option value="blue">Blue</option>
            </select>

            <button id="btnLangToggle" class="btn-header" style="font-weight: bold; width: auto;" onclick="window.toggleLanguage()">ENG</button>
            
            <button id="btnModeToggle" class="btn-header" style="font-weight: bold; width: auto; background: var(--border-bright); color: var(--text-main);" onclick="window.toggleFeedbackMode()" title="Toggle Feedback Mode">Script Mode</button>
            
            <select id="exportSelect" class="btn-header" style="width: auto; font-weight: 600; color: var(--accent);" title="Export Project">
                <option value="" data-i18n="btn_export">&#10515; Export</option>
                <option value="docx">Word (.docx)</option>
                <option value="srt">Subtitles (.srt)</option>
                <option value="csv">CSV File</option>
                <option value="xml">Premiere XML</option>
                <option value="edl">Resolve EDL</option>
            </select>
            <button class="btn-header" id="btnShortcuts" data-i18n="btn_settings">Settings</button>
            <button class="btn-header" id="btnHelp" data-i18n="btn_shortcuts">Shortcuts</button>
        </div>
    </header>
