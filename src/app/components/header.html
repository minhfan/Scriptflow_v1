    <header>
        <div class="header-logo">
            <a href="/tcpscript/project" title="Back to Projects" style="display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: var(--r-sm); border: 1px solid var(--border-bright); background: var(--bg-input); margin-right: 12px; transition: all var(--t-fast); box-shadow: inset 0 1px 0 var(--border-highlight);" onmouseover="this.style.color='var(--text-main)';this.style.borderColor='var(--accent)';this.style.background='var(--bg-hover)'" onmouseout="this.style.color='var(--text-muted)';this.style.borderColor='var(--border-bright)';this.style.background='var(--bg-input)'">&larr; Projects</a>
            <a href="/tcpscript/project" class="app-topbar-logo" aria-label="Back to project list">
                <span class="logo-title" style="letter-spacing: -0.03em;">TCP <span>ScriptFlow</span> <em>v2.0</em></span>
            </a>
        </div>
        <div class="header-center">
            <div class="layout-toggles" style="display: flex; gap: 6px; background: var(--bg-input); padding: 4px; border-radius: var(--r-md); border: 1px solid var(--border-bright);">
                <button id="btnLayout1" title="Classic: Default Sidebar" style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border: none; border-radius: 6px; background: var(--bg-panel); color: var(--text-main); cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; font-weight: 700; transition: all 0.2s;" onclick="window.switchLayout(1)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="14" y1="3" x2="14" y2="21"></line></svg>
                    Classic
                </button>
                <button id="btnLayout2" title="Full media" style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border: none; border-radius: 6px; background: transparent; color: var(--text-muted); cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; font-weight: 700; transition: all 0.2s;" onclick="window.switchLayout(2)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="11" x2="21" y2="11"></line></svg>
                    Full media
                </button>
            </div>
        </div>
        <div class="header-controls">
            <span id="saveStatus" style="font-family: 'JetBrains Mono', monospace; background: var(--bg-input); box-shadow: inset 0 1px 0 var(--border-highlight); font-size: 9px; padding: 5px 12px; border-radius: var(--r-sm);">Saved</span>
            
            <button id="btnModeToggle" class="btn-header" style="font-weight: 700; width: auto; background: var(--accent); color: #fff; border-color: var(--accent); text-shadow: 0 1px 2px rgba(0,0,0,0.2);" onclick="window.toggleFeedbackMode()" title="Toggle Feedback Mode">Script Mode</button>
            
            <select id="fpsSelect" class="btn-header" style="width: auto;">
                <option value="23.976">23.976 fps</option>
                <option value="24">24 fps</option>
                <option value="25">25 fps</option>
                <option value="29.97" selected>29.97 fps</option>
                <option value="30">30 fps</option>
                <option value="50">50 fps</option>
                <option value="59.94">59.94 fps</option>
                <option value="60">60 fps</option>
            </select>
            
            <select id="exportSelect" class="btn-header" style="width: auto; font-weight: 700;" title="Export Project">
                <option value="" data-i18n="btn_export">&#10515; Export</option>
                <option value="docx">Word (.docx)</option>
                <option value="srt">Subtitles (.srt)</option>
                <option value="csv">CSV File</option>
                <option value="xml">Premiere XML</option>
                <option value="edl">Resolve EDL</option>
            </select>



            <div class="pref-dropdown">
                <button class="btn-header pref-trigger" title="Preferences" style="display: flex; align-items: center; justify-content: center; padding: 6px 10px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
                <div class="pref-menu">
                    <select id="themeSelect" class="btn-header pref-item">
                        <option value="dark">Dark Tech</option>
                        <option value="light">Light</option>
                        <option value="blue">Blue</option>
                    </select>
                    <button id="btnLangToggle" class="btn-header pref-item" onclick="window.toggleLanguage()">ENG</button>
                    <button class="btn-header pref-item" id="btnShortcuts" data-i18n="btn_settings">Settings</button>
                    <button class="btn-header pref-item" id="btnHelp" data-i18n="btn_shortcuts">Shortcuts</button>
                </div>
            </div>
        </div>
    </header>
