            <div class="form-section" id="formSection">

                    <div class="tc-box" id="boxOut" title="Seek to OUT (W) / Mark if empty">

                        <div class="time" id="valTcOut">00:00:00:00</div>
                    </div>
                    <div class="tc-box" id="boxSwap" title="Seek to SWAP (E) / Mark if empty" style="display: none;">

                        <div class="time" id="valTcSwap">00:00:00:00</div>

                    <button type="button" id="btnCaptureFrame" title="Capture current frame" style="background: transparent; border: 1px solid var(--border-bright); color: var(--text-muted); border-radius: var(--r-sm); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0 10px; margin-left: auto; transition: all 0.2s;">

                    </button>
                </div>
                <div class="input-group">

                            <span class="preset-name" id="currentPresetName">Standard</span>
                            <span class="preset-arrow">▾</span>

                        <!-- Custom Dropdown Menu -->
                        <div id="tagPresetMenu" class="custom-preset-menu" style="display: none;">

                            </div>

                                <button id="btnCreatePreset" class="btn-create-preset" data-i18n="btn_add_preset">+ Thêm Preset</button>
                            </div>
                        </div>
                    </div>
                    <div class="action-button-group" id="actionButtonGroup" role="radiogroup" aria-label="Chọn tag">

                        <button type="button" class="action-button" data-action="POP-UP" role="radio">POP-UP</button>
                        <button type="button" class="action-button" data-action="SWAP" role="radio">SWAP</button>
                        <button type="button" class="action-button" data-action="QUESTION" role="radio">QUESTION</button>
                        <button type="button" class="action-button" data-action="QUOTE" role="radio">QUOTE</button>

                <div style="display: flex; gap: 10px; align-items: stretch; margin-top: 10px; flex: 1;">
                    <div style="display: flex; flex-direction: column; flex: 1; gap: 10px; height: 100%;">
                        <!-- Script Mode Inputs -->
                        <div class="script-mode-inputs" style="display: flex; flex-direction: column; flex: 1; gap: 10px; height: 100%;">
                            <div style="display: flex; flex-direction: column; gap: 4px; flex: 1;">
                                <label id="labelScript" data-i18n="lbl_script">SCRIPT (S):</label>
                                <textarea id="inputScript" style="flex: 1; resize: none; overflow-y: hidden;" data-i18n="col_script"></textarea>
                            </div>
                            <div style="display: flex; flex-direction: column; gap: 4px; flex: 1;">
                                <label id="labelNote" data-i18n="lbl_note">NOTE (N):</label>
                                <textarea id="inputNote" style="flex: 1; resize: none; overflow-y: hidden;" data-i18n="col_note"></textarea>
                            </div>
                        </div>
                        
                        <!-- Feedback Mode Inputs -->
                        <div class="feedback-mode-inputs" style="display: none; flex-direction: column; flex: 1; gap: 10px; height: 100%;">
                            <div style="display: flex; flex-direction: column; gap: 4px; flex: 1;">
                                <label data-i18n="lbl_review">REVIEW NOTE:</label>
                                <textarea id="inputReview" style="flex: 1; resize: none; overflow-y: hidden;" placeholder="Nhập comment feedback..."></textarea>
                            </div>
                            <div style="display: flex; flex-direction: column; gap: 4px;">
                                <label data-i18n="lbl_status">STATUS:</label>
                                <select id="inputStatus" style="padding: 8px; border-radius: 4px; background: var(--bg-input); color: var(--text-main); border: 1px solid var(--border-bright);">

                                    <option value="APPROVED">Approved</option>
                                </select>
                            </div>
                        </div>

                                <div class="floating-tab-menu" id="importShortFloatingMenu"></div>
                            </div>
                        </div>
                    </div>
                </div>
