<!-- Image Preview Modal -->
<div id="imagePreviewModal" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; pointer-events: none;">
    <div id="imagePreviewContent" class="modal-content" style="background: var(--bg-panel); border: 1px solid var(--border-bright); border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); padding: 4px; pointer-events: auto; position: absolute; transition: left 0.2s ease, top 0.2s ease, transform 0.2s ease; transform-origin: top left;">
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; border-bottom: 1px solid var(--border); margin-bottom: 4px; cursor: move;" id="imagePreviewDragHandle">
            <span style="font-size: 11px; font-weight: 700; color: var(--text-sub);">Preview</span>
            <button class="btn-close" onclick="document.getElementById('imagePreviewModal').style.display='none'" style="color: var(--text-sub); background: none; border: none; font-size: 16px; cursor: pointer;">&times;</button>
        </div>
        <img id="imagePreviewImg" src="" style="width: 480px; height: auto; object-fit: contain; border-radius: 4px; cursor: zoom-in; transition: width 0.2s ease;">
        <div style="text-align: center; margin-top: 8px; padding-bottom: 4px;">
            <button id="btnJumpFromPreview" class="btn primary" style="padding: 4px 12px; font-size: 10px;">Jump to Timecode</button>
        </div>
    </div>
</div>
