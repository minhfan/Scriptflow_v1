        <div class="right-col" id="tablePanel">
            <div class="table-header" style="align-items: center;">
                <h2 class="section-title" style="display: flex; align-items: center; gap: 12px; margin: 0; font-size: 24px;">
                    <span id="defaultScriptTitle" style="font-weight: 700;">Script</span>
                    <a id="activeSheetLink" href="#" target="_blank" style="display: none; color: var(--text-main); text-decoration: none; align-items: center; gap: 8px; font-weight: 700; transition: color var(--t-fast);">
                        <span id="activeSheetName">Sheet</span>
                    </a>
                    <span class="log-count-badge" id="logCount" style="margin-left: 8px; font-size: 14px;">0</span>
                </h2>
            </div>
            <div class="action-btns" style="display: flex; flex-wrap: wrap; align-items: center; width: 100%; margin-bottom: 16px; gap: 10px;">
                <div style="position: relative;">
                    <span style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; display: flex; align-items: center;">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                    </span>
                    <select id="filterAction" style="background: var(--bg-input); border: 1px solid var(--border-bright); border-radius: var(--r-sm); color: var(--text-main); font-size: 11px; padding: 6px 28px 6px 28px; outline: none; font-family: 'Plus Jakarta Sans', sans-serif; cursor: pointer; appearance: none; width: auto; box-shadow: inset 0 1px 0 var(--border-highlight); transition: all var(--t-fast);">
                        <option value="ALL" data-i18n="opt_all_actions">All actions</option>
                        <option value="DELETE">DELETE</option>
                        <option value="SWAP">SWAP</option>
                        <option value="POP-UP">POP-UP</option>
                        <option value="QUESTION">QUESTION</option>
                        <option value="QUOTE">QUOTE</option>
                        <option value="NOTE">NOTE</option>
                        <option value="OTHERS">OTHERS</option>
                    </select>
                    <span style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; font-size: 8px;">▼</span>
                </div>
                <div style="position: relative;">
                    <span style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; display: flex; align-items: center;">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </span>
                    <input type="text" id="searchInput" placeholder="Search script, timecode..." style="background: var(--bg-input); border: 1px solid var(--border-bright); border-radius: var(--r-sm); color: var(--text-main); font-size: 11px; padding: 6px 12px 6px 28px; width: 240px; outline: none; font-family: 'Plus Jakarta Sans', sans-serif; box-shadow: inset 0 1px 0 var(--border-highlight); transition: all var(--t-fast);">
                </div>
                <div style="display: flex; gap: 4px; margin-left: auto; align-items: center;">
                    <label class="btn-action btn-header" id="lblImport" title="Import CSV" style="cursor: pointer; margin: 0; padding: 6px 10px; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; box-shadow: none; color: var(--text-muted);" onmouseover="this.style.color='var(--text-main)';this.style.background='var(--bg-hover)';" onmouseout="this.style.color='var(--text-muted)';this.style.background='transparent';">
                        <input type="file" id="csvImport" accept=".csv, .xlsx, .xls" style="display: none;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    </label>
                    <button type="button" class="btn-action btn-header" id="btnToggleView" title="Toggle Grid/Table View" style="padding: 6px 10px; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; box-shadow: none; color: var(--text-muted);" onmouseover="this.style.color='var(--text-main)';this.style.background='var(--bg-hover)';" onmouseout="this.style.color='var(--text-muted)';this.style.background='transparent';">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    </button>
                    <button type="button" class="btn-action btn-sync-brand btn-header" id="btnSyncSheets" title="Sync current sheet" style="background: var(--success); color: #000; border-color: var(--success); font-weight: 800; font-family: 'Plus Jakarta Sans', sans-serif; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25); text-transform: uppercase; letter-spacing: 0.05em; margin-left: 8px; padding: 6px 16px; transition: all var(--t-spring);" onmouseover="this.style.transform='translateY(-1px)';" onmouseout="this.style.transform='none';">Sync Sheet</button>
                </div>
            </div>
            <div class="table-wrap">
                <table id="logTable">
                    <colgroup>
                        <col class="col-stt">
                        <col class="col-play" style="width: 44px;">
                        <col class="col-thumb feedback-only" style="width: 60px;">
                        <col class="col-status feedback-only" style="width: 90px;">
                        <col class="col-action">
                        <col class="col-tc">
                        <col class="col-tc">
                        <col class="col-tc">
                        <col>
                        <col>
                        <col class="feedback-only">
                        <col class="col-delete">
                    </colgroup>
                    <thead>
                        <tr>
                            <th data-i18n="col_stt">STT</th>
                            <th></th>
                            <th data-i18n="col_thumb" class="feedback-only">THUMB</th>
                            <th data-i18n="col_status" class="feedback-only">STATUS</th>
                            <th data-i18n="col_tag">TAG</th>
                            <th data-i18n="col_in">TC IN</th>
                            <th data-i18n="col_out">TC OUT</th>
                            <th data-i18n="col_swap">TC SWAP</th>
                            <th data-i18n="col_script">SCRIPT</th>
                            <th data-i18n="col_note">NOTE</th>
                            <th data-i18n="col_review" class="feedback-only">REVIEW</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="logBody"></tbody>
                </table>
            </div>
            <div id="storyboardContainer" class="storyboard-wrap" style="display: none;">
                <!-- Storyboard cards will be generated here -->
            </div>
            
            <div id="feedbackContainer" class="feedback-feed" style="display: none;">
                <!-- Feedback mode cards will be generated here -->
            </div>
        </div>
